name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        emacs_version:
          - 29.1
          - 30.1
          - snapshot
    steps:
      - uses: actions/checkout@v4

      - uses: purcell/setup-emacs@master
        with:
          version: ${{ matrix.emacs_version }}

      # Conformance oracle (fc-qx1.21): native SVG is rasterized with
      # rsvg-convert and compared with bin/chart's committed reference
      # PNGs (test/conformance/ref), so CI needs only rsvg-convert and
      # Arial-metric fonts.  Setting the repository variable
      # CHART_RUNTIME_URL to a tarball whose bin/chart is the pinned
      # release also rebuilds the references from bin/chart and checks
      # the vendored theme against it.
      - name: Install conformance rasterizer
        run: sudo apt-get install -y librsvg2-bin fonts-liberation

      - name: Install bin/chart
        if: ${{ vars.CHART_RUNTIME_URL != '' }}
        run: |
          mkdir -p "$HOME/chart-runtime"
          curl -fsSL "${{ vars.CHART_RUNTIME_URL }}" -o /tmp/chart-runtime.tgz
          tar -xzf /tmp/chart-runtime.tgz -C "$HOME/chart-runtime"
          echo "$HOME/chart-runtime/bin" >> "$GITHUB_PATH"

      - name: Run tests
        run: make test

      - name: Byte-compile
        run: make compile

      # Performance budget (fc-qx1.9): the byte-compiled 1k/10k/100k
      # ladder against src/eas/bench-budget.json, whose references were
      # measured on Emacs 30.1.  Limits scale by a calibration run, so a
      # slower runner is not a regression; a stage past its limit fails
      # with BUDGET_EXCEEDED.
      - name: Benchmark budget
        if: ${{ matrix.emacs_version == '30.1' }}
        run: BENCH_OUT=eas-bench.json make bench

      - name: Upload benchmark
        if: ${{ always() && matrix.emacs_version == '30.1' }}
        uses: actions/upload-artifact@v4
        with:
          name: eas-bench
          path: eas-bench.json
          if-no-files-found: ignore

      - name: CLI smoke test
        run: bin/financial-chart example payoff | bin/financial-chart render -

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
