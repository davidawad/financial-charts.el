name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # eas.el requires Emacs 30.1.
        emacs_version:
          - 30.1
          - snapshot
    steps:
      - uses: actions/checkout@v4
        with:
          path: financial-chart.el

      # The chart engine is a separate package.  davidawad/eas.el is
      # private, so the default GITHUB_TOKEN cannot read it: add a
      # repository secret named EAS_TOKEN (a fine-grained personal access
      # token with Contents: read on davidawad/eas.el).  The Makefile
      # finds it through EAS=../eas.el below.
      - name: Check out eas.el
        uses: actions/checkout@v4
        with:
          repository: davidawad/eas.el
          token: ${{ secrets.EAS_TOKEN }}
          path: eas.el

      - uses: purcell/setup-emacs@master
        with:
          version: ${{ matrix.emacs_version }}

      - name: Run tests
        working-directory: financial-chart.el
        run: make test EAS=../eas.el

      - name: Byte-compile
        working-directory: financial-chart.el
        run: make compile EAS=../eas.el

      - name: CLI smoke test
        working-directory: financial-chart.el
        env:
          EAS: ${{ github.workspace }}/eas.el
        run: bin/financial-chart example payoff | bin/financial-chart render -

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
