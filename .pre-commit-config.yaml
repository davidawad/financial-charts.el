repos:
  - repo: local
    hooks:
      - id: check-branch-worktree
        name: check branch/worktree (swe-engineering-standards)
        entry: scripts/git-hooks/check-branch-worktree.sh
        language: script
        pass_filenames: false
        always_run: true

  - repo: local
    hooks:
      - id: push-after-commit
        name: push after commit (swe-engineering-standards)
        entry: scripts/git-hooks/push-after-commit.sh
        language: script
        pass_filenames: false
        always_run: true
        stages: [post-commit]
        verbose: true

  - repo: local
    hooks:
      - id: dependency-freshness-check
        name: dependency freshness check (dot-5nb)
        entry: scripts/git-hooks/dependency-freshness-check.sh
        language: script
        pass_filenames: false
        always_run: true

  - repo: local
    hooks:
      - id: check-elisp-complexity
        name: Emacs Lisp cyclomatic/cognitive complexity report (WARN-only)
        entry: python3 scripts/checks/check-elisp-complexity.py
        language: system
        pass_filenames: false
        files: \.el$

  - repo: local
    hooks:
      - id: check-elisp-format
        name: Emacs Lisp elisp-autofmt formatting check (WARN-only)
        entry: python3 scripts/checks/check-elisp-format.py
        language: system
        pass_filenames: false
        files: \.el$
