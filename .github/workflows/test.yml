name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        emacs_version:
          - 29.1
          - 30.1
          - snapshot
    steps:
      - uses: actions/checkout@v4

      - uses: purcell/setup-emacs@master
        with:
          version: ${{ matrix.emacs_version }}

      # Conformance oracle (fc-qx1.21): bin/chart from the chart
      # runtime plus rsvg-convert.  Set the repository variable
      # CHART_RUNTIME_URL to a tarball whose bin/chart is the pinned
      # release; without it the oracle tests are skipped with the reason
      # printed in the ERT output.
      - name: Install conformance oracle
        if: ${{ vars.CHART_RUNTIME_URL != '' }}
        run: |
          sudo apt-get install -y librsvg2-bin
          mkdir -p "$HOME/chart-runtime"
          curl -fsSL "${{ vars.CHART_RUNTIME_URL }}" -o /tmp/chart-runtime.tgz
          tar -xzf /tmp/chart-runtime.tgz -C "$HOME/chart-runtime"
          echo "$HOME/chart-runtime/bin" >> "$GITHUB_PATH"

      - name: Run tests
        run: make test

      - name: Byte-compile
        run: make compile

      - name: CLI smoke test
        run: bin/financial-chart example payoff | bin/financial-chart render -

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
