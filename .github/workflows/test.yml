name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        emacs_version:
          - 29.1
          - 30.1
          - snapshot
    steps:
      - uses: actions/checkout@v4

      - uses: purcell/setup-emacs@master
        with:
          version: ${{ matrix.emacs_version }}

      - name: Run tests
        run: make test

      - name: Byte-compile
        run: make compile

      - name: CLI smoke test
        run: bin/financial-chart example payoff | bin/financial-chart render -
